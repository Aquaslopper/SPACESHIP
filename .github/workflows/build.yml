name: Build Spaceship Windows EXE

on:
  push:
    branches: [ main, master, "arena/**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-id-prefixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Station and planet id prefixes
        run: bash tools/check-id-prefixes.sh

  build-windows:
    needs: check-id-prefixes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW-w64 cross-compiler
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 ninja-build zip

      - name: Configure CMake for Windows (MinGW-w64 cross, Release)
        run: |
          set -euo pipefail
          cmake -S . -B build-win -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOPENGL_gl_LIBRARY=opengl32 \
            -DSPACESHIP_BUILD_TESTS=OFF \
            -DSPACESHIP_REQUIRE_GUI=ON \
            -DCMAKE_CXX_FLAGS="-D_USE_MATH_DEFINES -DM_PI=3.14159265358979323846" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"

      - name: Build spaceship.exe
        run: |
          set -euo pipefail
          cmake --build build-win --target spaceship --parallel

      - name: Package portable Windows folder
        run: |
          set -euo pipefail
          mkdir -p dist/Spaceship/runtime/saves
          cp build-win/spaceship.exe dist/Spaceship/
          cp -r assets dist/Spaceship/
          cp README.md dist/Spaceship/
          [ -f docs/PLAYING.md ] && cp docs/PLAYING.md dist/Spaceship/PLAYING.md || true

      - name: Package Release ZIP
        run: |
          set -euo pipefail
          cd dist
          zip -r ../Spaceship_Windows.zip ./Spaceship

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spaceship-Windows-x64
          path: Spaceship_Windows.zip

  test-linux:
    needs: check-id-prefixes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install graphics development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libasound2-dev ffmpeg
      - name: Configure and build client and tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSPACESHIP_REQUIRE_GUI=ON
          cmake --build build --parallel 4
          cmake --build build --target spaceship
          ffmpeg -v error -f lavfi -i sine=frequency=440:duration=0.2 "${RUNNER_TEMP}/01-test.wav"
          ffmpeg -v error -i "${RUNNER_TEMP}/01-test.wav" -f mp3 "${RUNNER_TEMP}/02-test.MP3"
          ffmpeg -v error -i "${RUNNER_TEMP}/01-test.wav" "${RUNNER_TEMP}/03-test.ogg"
          build/spaceship --check-music-file "${RUNNER_TEMP}/01-test.wav"
          build/spaceship --check-music-file "${RUNNER_TEMP}/02-test.MP3"
          build/spaceship --check-music-file "${RUNNER_TEMP}/03-test.ogg"
      - name: Require input and drawing probes, then run regression suite
        run: |
          bash tools/check-gui-syntax.sh
          bash tools/check-imgui-input.sh
          bash tools/check-draw.sh
          ctest --test-dir build --output-on-failure -j 4
