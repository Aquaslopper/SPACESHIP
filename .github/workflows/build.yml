name: Build Spaceship Windows EXE

on:
  push:
    branches: [ main, master, "arena/**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare CMake and Windows GCC Compatibility
        shell: bash
        run: |
          python3 - << 'EOF'
          import pathlib, re

          # 1. CMakeLists.txt fixes for CMake 4.0 + Windows
          cmake_path = pathlib.Path("CMakeLists.txt")
          if cmake_path.exists():
              txt = cmake_path.read_text(encoding="utf-8")
              txt = re.sub(r'catch_discover_tests\s*\([^)]*\)', '# skipped for EXE packaging', txt)
              txt = txt.replace('-Werror', '')
              txt = txt.replace('find_package(X11 QUIET)', 'set(X11_FOUND TRUE)')
              txt = txt.replace('${RLIMGUI_SOURCE_DIR}', '${rlimgui_SOURCE_DIR}')
              txt = txt.replace('${IMGUI_SOURCE_DIR}', '${imgui_SOURCE_DIR}')
              txt = txt.replace('${RAYLIB_SOURCE_DIR}', '${raylib_SOURCE_DIR}')
              cmake_path.write_text(txt, encoding="utf-8")

          # 2. Catalog.cpp: avoid GCC 13/14 false-positive -Wdangling-reference
          cat_path = pathlib.Path("cpp/data/Catalog.cpp")
          if cat_path.exists():
              txt = cat_path.read_text(encoding="utf-8")
              txt = txt.replace("const std::string& file)", "std::string file)")
              txt = txt.replace("const std::string& ctx)", "std::string ctx)")
              cat_path.write_text(txt, encoding="utf-8")
          EOF

      - name: Pre-fetch ImGui & rlImGui sources explicitly
        shell: bash
        run: |
          git clone --depth 1 --branch v1.92.7 https://github.com/ocornut/imgui.git build-deps/imgui
          git clone --depth 1 --branch Raylib_6_0 https://github.com/raylib-extras/rlImGui.git build-deps/rlimgui

      - name: Configure CMake (Release)
        shell: bash
        run: |
          cmake -B build-win -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOPENGL_gl_LIBRARY=opengl32 \
            -DFETCHCONTENT_SOURCE_DIR_IMGUI="$PWD/build-deps/imgui" \
            -DFETCHCONTENT_SOURCE_DIR_RLIMGUI="$PWD/build-deps/rlimgui" \
            -DimGui_SOURCE_DIR="$PWD/build-deps/imgui" \
            -Dimgui_SOURCE_DIR="$PWD/build-deps/imgui" \
            -DrlImGui_SOURCE_DIR="$PWD/build-deps/rlimgui" \
            -Drlimgui_SOURCE_DIR="$PWD/build-deps/rlimgui" \
            -DCMAKE_CXX_FLAGS="-D_USE_MATH_DEFINES -DM_PI=3.14159265358979323846 -Wno-dangling-reference -Wno-error" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"

      - name: Build spaceship.exe
        shell: bash
        run: |
          if ! cmake --build build-win --target spaceship --parallel 2>&1 | tee build_err.log; then
            echo "Checking for Windows std::filesystem::path -> std::string implicit conversion..."
            python3 - << 'EOF'
            import pathlib, re
            log = pathlib.Path("build_err.log").read_text(encoding="utf-8", errors="ignore")
            patched = set()
            for m in re.finditer(r'([A-Za-z]:/[^\s:]+\.(?:cpp|h)):(\d+):(\d+): error: cannot convert .*path.* to .*basic_string', log):
                fpath, lno, col = m.group(1), int(m.group(2)), int(m.group(3))
                if (fpath, lno) in patched:
                    continue
                patched.add((fpath, lno))
                p = pathlib.Path(fpath)
                lines = p.read_text(encoding="utf-8").splitlines()
                line = lines[lno - 1]
                pos = min(max(col - 1, 0), len(line) - 1)
                # Find argument bounds around pos at paren depth 0
                l_idx, depth = pos, 0
                while l_idx > 0:
                    c = line[l_idx - 1]
                    if c == ')': depth += 1
                    elif c == '(':
                        if depth == 0: break
                        depth -= 1
                    elif c in ',;=' and depth == 0: break
                    l_idx -= 1
                r_idx, depth = pos, 0
                while r_idx < len(line):
                    c = line[r_idx]
                    if c == '(': depth += 1
                    elif c == ')':
                        if depth == 0: break
                        depth -= 1
                    elif c in ',;' and depth == 0: break
                    r_idx += 1
                expr = line[l_idx:r_idx].strip()
                lines[lno - 1] = line[:l_idx] + f"({expr}).string()" + line[r_idx:]
                print(f"Auto-patched {fpath}:{lno} -> {lines[lno - 1]}")
                p.write_text("\n".join(lines) + "\n", encoding="utf-8")
            EOF
            cmake --build build-win --target spaceship --parallel
          fi

      - name: Package Portable Windows Folder
        shell: bash
        run: |
          mkdir -p dist/Spaceship/runtime/saves
          cp build-win/spaceship.exe dist/Spaceship/
          cp -r assets dist/Spaceship/
          for doc in README.md PARITY.md SPAM_AUDIT.md; do
            [ -f "$doc" ] && cp "$doc" dist/Spaceship/
          done

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spaceship-Windows-x64
          path: dist/Spaceship/
