# ============================================================================
#  build.yml — build the game on Windows and on Linux.
#  ---------------------------------------------------------------------------
#  Nothing here edits the sources. The portability fixes the Windows build needs
#  (UTF-8 literals, NOMINMAX, M_PI, the lowercased FetchContent variables, a
#  relative asset directory, a GUI subsystem) live in CMakeLists.txt and in the
#  C++ files, so a developer's local build and this one are the same build.
#
#    windows-exe   windows-latest, Ninja + MinGW gcc/g++, builds spaceship.exe,
#                  runs the Catch2 suite natively, assembles dist/Spaceship/ and
#                  uploads it as the Spaceship-Windows-x64 artifact.
#    linux-parity  ubuntu-latest, X11/OpenGL/ALSA, links the real client and runs
#                  every CTest gate, including the differential voyages against
#                  Spaceship.hta.
#
#  -DCMAKE_POLICY_VERSION_MINIMUM=3.5 is passed on both: CMake 4 rejects the
#  cmake_minimum_required() that raylib's bundled glfw declares, and this is the
#  supported way to say "treat these older projects as compatible".
# ============================================================================
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  #  Windows: the downloadable build
  # --------------------------------------------------------------------------
  windows-exe:
    name: Windows x64 (spaceship.exe + artifact)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # windows-latest ships CMake and Ninja but not a GNU toolchain, and the
      # port's Windows build is the MinGW one (the same recipe as Xeno-koi's
      # release): no MSVC code-page surprises, and -static means the zip needs
      # no DLLs beside it.
      - name: Install MinGW-w64
        run: |
          choco install mingw -y --no-progress
          # Chocolatey edits the machine PATH, which later steps only sometimes
          # inherit; GITHUB_PATH is the reliable way to hand gcc to the build.
          echo "C:\ProgramData\mingw64\mingw64\bin" >> $env:GITHUB_PATH

      - name: Show the toolchain
        run: |
          cmake --version
          ninja --version
          gcc --version
          g++ --version

      - name: Configure (Ninja + MinGW, Release)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build spaceship and spaceship_tests
        run: cmake --build build --parallel

      - name: Run the unit suite
        run: .\build\spaceship_tests.exe --reporter compact

      - name: Assemble dist/Spaceship
        shell: bash
        run: |
          set -euo pipefail
          dist="dist/Spaceship"
          rm -rf "$dist"
          mkdir -p "$dist/assets" "$dist/runtime/saves"

          cp build/spaceship.exe "$dist/spaceship.exe"

          # The four asset folders the game loads, exactly as shipped.
          for part in data art fonts audio; do
            if [ -d "assets/$part" ]; then
              cp -r "assets/$part" "$dist/assets/$part"
            fi
          done

          # A save folder that exists but is empty: the game writes into it.
          cp runtime/saves/.gitkeep "$dist/runtime/saves/.gitkeep" 2>/dev/null || true
          {
            echo "This folder holds the three save slots, beside spaceship.exe."
            echo "The game creates them on the first save; deleting one is a"
            echo "safe way to start a slot over."
          } > "$dist/runtime/saves/README.txt"

          cp README.md PARITY.md SPAM_AUDIT.md "$dist/"

          echo "---- distribution ----"
          find "$dist" -maxdepth 2 | sort

      - name: Prove the executable is a Windows GUI binary
        shell: bash
        run: |
          objdump -p dist/Spaceship/spaceship.exe | grep -i "^Subsystem" | tee subsystem.txt
          grep -q "Subsystem.*00000002" subsystem.txt

      - name: Upload the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Spaceship-Windows-x64
          path: dist/Spaceship/
          if-no-files-found: error
          retention-days: 90

  # --------------------------------------------------------------------------
  #  Linux: the linked GUI and every gate
  # --------------------------------------------------------------------------
  linux-parity:
    name: Linux x64 (linked GUI + all CTest gates)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the windowing, GL and audio development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libasound2-dev

      - name: Install Node.js (the reference harness and the catalogue gate)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure (Ninja, Release)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build everything
        run: cmake --build build --parallel

      - name: Run every gate
        run: ctest --test-dir build --output-on-failure -j 4
