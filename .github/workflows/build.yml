# ============================================================================
#  build.yml — compile the game on both platforms and hand out a Windows zip.
#  ---------------------------------------------------------------------------
#  Two jobs, on every push, every pull request, and on demand:
#
#    windows-exe    MSVC builds spaceship.exe and the test binary, runs the
#                   168-case suite, assembles dist/Spaceship/ and uploads it as
#                   the Spaceship-Windows-x64 artifact.
#    linux-parity   the same tree linked against real X11/OpenGL/ALSA — the GUI
#                   binary and every CTest gate, including the differential
#                   voyages against Spaceship.hta.
#
#  Everything is fetched by CMake (raylib 6.0, Dear ImGui v1.92.7, rlImGui,
#  Catch2, nlohmann/json), so a runner needs only a compiler, CMake and network.
# ============================================================================
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: the artifact is the point,
# and only the newest tree matters.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  #  Windows: the downloadable build
  # --------------------------------------------------------------------------
  windows-exe:
    name: Windows x64 (spaceship.exe + artifact)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure (Release)
        run: |
          set -o pipefail
          # The configure log is the one thing a failed run has to explain
          # itself with: keep it, and surface its tail as an annotation.
          if ! cmake -S . -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log; then
            cmake --version | head -1 | sed 's/^/::error::/'
            echo "::error::--- error lines ---"
            grep -n -i -m 6 -E "cmake error|error:|could not|failed" configure.log | sed 's/^/::error::/' || true
            echo "::error::--- context ---"
            sed -n '/CMake Error/,+6p' configure.log | sed 's/^/::error::/' || true
            echo "::error::--- last lines ---"
            tail -6 configure.log | sed 's/^/::error::/'
            exit 1
          fi

      - name: Build spaceship and spaceship_tests
        run: cmake --build build --config Release --parallel

      - name: Run the unit suite
        run: ./build/Release/spaceship_tests.exe --reporter compact

      - name: Assemble dist/Spaceship
        run: |
          set -euo pipefail
          dist="dist/Spaceship"
          rm -rf "$dist"
          mkdir -p "$dist/assets" "$dist/runtime/saves"

          cp build/Release/spaceship.exe "$dist/spaceship.exe"

          # The four asset folders the game loads, exactly as shipped.
          for part in data art fonts audio; do
            if [ -d "assets/$part" ]; then
              cp -r "assets/$part" "$dist/assets/$part"
            fi
          done

          # A save slot that exists but is empty: the game writes into it.
          cp runtime/saves/.gitkeep "$dist/runtime/saves/.gitkeep" 2>/dev/null || true
          {
            echo "This folder holds the three save slots, beside spaceship.exe."
            echo "The game creates them on the first save; deleting one is a"
            echo "safe way to start a slot over."
          } > "$dist/runtime/saves/README.txt"
          cp README.md PARITY.md SPAM_AUDIT.md "$dist/"

          echo "---- distribution ----"
          find "$dist" -maxdepth 3 -type d | sort
          du -sh "$dist"

      - name: Smoke-test the build headlessly
        run: |
          # spaceship.exe is a windowed binary and would sit there waiting for a
          # window nobody is watching, so the smoke test drives the console
          # harness instead: same core, same catalogue, same assets, and it
          # prints a canonical trace for a real voyage.
          ./build/Release/spaceship_console.exe tests/parity/voyage-01.script | head -5
          test -f dist/Spaceship/spaceship.exe
          test -f dist/Spaceship/assets/data/manifest.json

      - name: Upload the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Spaceship-Windows-x64
          path: dist/Spaceship/
          if-no-files-found: error
          retention-days: 90

  # --------------------------------------------------------------------------
  #  Linux: the linked GUI and every gate
  # --------------------------------------------------------------------------
  linux-parity:
    name: Linux x64 (linked GUI + all CTest gates)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the windowing, GL and audio development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libasound2-dev

      - name: Install Node.js (the reference harness and the catalogue gate)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure (Release)
        run: |
          set -o pipefail
          if ! cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log; then
            cmake --version | head -1 | sed 's/^/::error::/'
            echo "::error::--- error lines ---"
            grep -n -i -m 6 -E "cmake error|error:|could not|failed" configure.log | sed 's/^/::error::/' || true
            echo "::error::--- context ---"
            sed -n '/CMake Error/,+6p' configure.log | sed 's/^/::error::/' || true
            echo "::error::--- last lines ---"
            tail -6 configure.log | sed 's/^/::error::/'
            exit 1
          fi

      - name: Build everything
        run: cmake --build build --parallel

      - name: Run every gate
        run: ctest --test-dir build --output-on-failure -j 4
