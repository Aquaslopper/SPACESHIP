name: Protocol GameOver

on:
  push:
    branches: [main, master, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameover:
    name: Protocol GameOver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check death conditions and prerequisites
        run: bash tools/check-gameover.sh
