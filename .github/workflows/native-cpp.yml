name: Game checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-and-js:
    name: Linux C++ and game tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Existing game regression tests
        run: |
          node tools/export-native-data.cjs --check
          for test in tests/*.test.cjs; do node "$test"; done
      - name: Configure native C++ game
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build native C++ game
        run: cmake --build build --parallel
      - name: Test native C++ game
        run: ctest --test-dir build --output-on-failure

  windows-exe:
    name: Windows EXE build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure 64-bit Windows build
        run: cmake -S . -B build -A x64
      - name: Compile Windows executable
        shell: pwsh
        run: |
          $output = & cmake --build build --config Release --parallel 2>&1
          $result = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($result -ne 0) {
            $output | Where-Object { $_ -match 'error' } | ForEach-Object { Write-Host "::error::$_" }
          }
          exit $result
      - name: Test Windows build
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Publish Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: spaceship-windows-x64
          path: |
            build/Release/spaceship.exe
            build/Release/WINDOWS-README.txt
            build/Release/NATIVE-PORT.md
            build/Release/JSON-LICENSE.txt
          if-no-files-found: error
